name: Paper research checks

on:
  pull_request:
    paths:
      - 'research/**'
      - 'tests/test_*audit.py'
      - 'tests/test_paired_paper_comparison.py'
      - 'tests/test_walk_forward_paper.py'
      - 'tests/test_paper_entry_exit_simulator.py'
      - 'tests/test_paper_experiment.py'
      - 'tests/test_v12_agent_coordinator.py'
      - 'tests/test_v12_research_runner.py'
      - 'tests/test_v12_dashboard.py'
      - '.github/workflows/paper-research-checks.yml'
  push:
    branches:
      - 'research/**'

permissions:
  contents: read

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline research unit tests
        run: |
          python -m unittest discover -s tests -p 'test_entry_latency_audit.py' -v
          python -m unittest discover -s tests -p 'test_paired_paper_comparison.py' -v
          python -m unittest discover -s tests -p 'test_paper_risk_audit.py' -v
          python -m unittest discover -s tests -p 'test_walk_forward_paper.py' -v
          python -m unittest discover -s tests -p 'test_paper_entry_exit_simulator.py' -v
          python -m unittest discover -s tests -p 'test_paper_experiment.py' -v
          python -m unittest discover -s tests -p 'test_v12_agent_coordinator.py' -v
          python -m unittest discover -s tests -p 'test_v12_research_runner.py' -v
          python -m unittest discover -s tests -p 'test_v12_dashboard.py' -v
